version: 2

# Modules are matched by glob rather than listed one per directory, so a new
# module is picked up without editing this file — the same way the CI matrix
# and the Taskfile discover modules from their go.mod files.
#
# Each ecosystem opens a single grouped pull request, so one dependency
# bumped across every module arrives as one review rather than one per
# module.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /*
    schedule:
      interval: daily
    groups:
      gomod:
        patterns: ["*"]
