name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new stdlib CVE surfaces on main rather than on open PRs.
    - cron: "0 6 * * 1"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge into main, whose first parent
          # is main, so diffing against HEAD^1 sees exactly the PR's changes.
          fetch-depth: 2
      - id: set
        # Explicit, for pipefail: a failing git diff must fail the job, not
        # yield an empty matrix that skips every check.
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          all=$(find . -name go.mod -not -path './.git/*' \
            | xargs -n1 dirname | sed 's|^\./||' | sort)
          modules=$all
          # Pushes to main and the weekly scan check every module. A pull
          # request checks only the modules it touches, unless it touches a
          # file outside every module, such as this workflow or the lint
          # config, which can affect them all. Root Markdown affects none.
          if [ "$EVENT" = pull_request ]; then
            modules=$(git diff --name-only --no-renames HEAD^1 HEAD | while read -r f; do
              [[ $f != */* && $f == *.md ]] && continue
              owner='*'
              for m in $all; do
                if [[ $f == "$m"/* ]]; then owner=$m; fi
              done
              echo "$owner"
            done | sort -u)
            if echo "$modules" | grep -qx '\*'; then modules=$all; fi
          fi
          echo "modules=$(echo "$modules" | jq -R -s -c 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  ci:
    needs: discover
    if: needs.discover.outputs.modules != '[]'
    name: Test & Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # Off so a restored build cache can't make go test report (cached).
          cache: false

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)" || { echo "::error::not gofmt-clean"; gofmt -l .; exit 1; }

      - name: tidy
        working-directory: ${{ matrix.module }}
        run: go mod tidy -diff

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          working-directory: ${{ matrix.module }}

      # govulncheck reports stdlib vulnerabilities against the toolchain it runs
      # under, so scanning on the go.mod minimum reddens CI on every Go patch
      # release. The steps above already proved that minimum builds and passes.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # Off: a restore here collides with the module files that the
          # golangci-lint goinstall build already wrote.
          cache: false

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
