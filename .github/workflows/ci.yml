name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new stdlib CVE surfaces on main rather than on open PRs.
    - cron: "0 6 * * 1"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - id: set
        run: |
          modules=$(find . -name go.mod -not -path './.git/*' \
            | xargs -n1 dirname | sed 's|^\./||' | sort \
            | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  ci:
    needs: discover
    name: Test & Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)" || { echo "::error::not gofmt-clean"; gofmt -l .; exit 1; }

      - name: tidy
        working-directory: ${{ matrix.module }}
        run: go mod tidy -diff

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          working-directory: ${{ matrix.module }}

      # govulncheck reports stdlib vulnerabilities against the toolchain it runs
      # under, so scanning on the go.mod minimum reddens CI on every Go patch
      # release. The steps above already proved that minimum builds and passes.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
