# golangci-lint v2 config shared by every module. golangci-lint finds it by
# walking up from the module directory, so `task lint` and CI need no flags.
version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused) plus
  # the linters that enforce CLAUDE.md's testing conventions.
  enable:
    - paralleltest # t.Parallel() at the top of every test and subtest
    - tparallel # ... and consistently between a test and its subtests
    - thelper # t.Helper() in test helpers
    - usetesting # t.TempDir(), t.Setenv() and friends over os equivalents
    - testifylint # testify misuse, including require off the test goroutine
  settings:
    testifylint:
      disable:
        # House style uses assert for checks the rest of the test survives.
        - require-error
      expected-actual:
        # The default also matches `exp`, which here names an expiry.
        pattern: (^(expected|want(ed)?)([A-Z]\w*)?$)|(^(\w*[a-z])?(Expected|Want(ed)?)$)
